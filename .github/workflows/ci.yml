name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unofa
          POSTGRES_PASSWORD: unofa
          POSTGRES_DB: unofa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unofa" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://unofa:unofa@127.0.0.1:5432/unofa?sslmode=disable
      UNOFA_TEST_DSN: postgres://unofa:unofa@127.0.0.1:5432/unofa?sslmode=disable
      UNOFA_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: migrate
        run: go run ./cmd/migrate
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web install
        working-directory: web
        run: npm ci
      - name: web typecheck + lint + test
        working-directory: web
        run: |
          npx tsc --noEmit
          npm run lint
          npx vitest run

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io requires a lowercase repository path.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: |
            ${{ env.IMAGE }}-nginx:${{ github.sha }}
            ${{ env.IMAGE }}-nginx:latest
