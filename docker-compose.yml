# UNOFA deploy: nginx + app + Redis on one host, one Go instance.
# Postgres runs as its own compose project (docker-compose.db.yml), reached as db:5432 over the external network unofa-db.
# Docs: docs/spec/07-ops-admin.md §Deploy.
services:
  app:
    image: ghcr.io/tranngochien278/unofa:latest
    build:
      context: .
      target: app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [default, db]
    environment:
      DATABASE_URL: postgres://unofa:${POSTGRES_PASSWORD}@db:5432/unofa?sslmode=disable
      REDIS_URL: redis:6379
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  migrate:
    image: ghcr.io/tranngochien278/unofa:latest
    entrypoint: ["/app/migrate"]
    command: []
    restart: "no"
    networks: [db]
    environment:
      DATABASE_URL: postgres://unofa:${POSTGRES_PASSWORD}@db:5432/unofa?sslmode=disable

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: ghcr.io/tranngochien278/unofa-nginx:latest
    build:
      context: .
      target: nginx
    restart: unless-stopped
    depends_on:
      - app
    environment:
      UNOFA_ADMIN: ${UNOFA_ADMIN:-true}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/unofa:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro

networks:
  db:
    name: unofa-db
    external: true

volumes:
  certbot-webroot:
