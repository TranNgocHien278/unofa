# UNOFA deploy: nginx + app + Postgres + Redis on one host, one Go instance.
# Docs: docs/spec/07-ops-admin.md §Deploy.
services:
  app:
    image: ghcr.io/unofa/unofa:${UNOFA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://unofa:${POSTGRES_PASSWORD}@db:5432/unofa?sslmode=disable
      REDIS_URL: redis:6379
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unofa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: unofa
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unofa -d unofa"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/unofa/unofa:${UNOFA_TAG:-latest}
    entrypoint: ["/app/migrate"]
    command: []
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unofa:${POSTGRES_PASSWORD}@db:5432/unofa?sslmode=disable

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/uno.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro

volumes:
  pgdata:
  certbot-webroot:
